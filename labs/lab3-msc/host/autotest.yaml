name: lab3-msc 产测（空白盘产线专用）
device: {backend: msc, vid: 0xCAFE, pid: 0x4002}  # 与 firmware/src/usb_descriptors.c 一致
steps:
  - {type: msc_inquiry, name: INQUIRY}
  - {type: msc_capacity, name: 容量核对, limits: {min_gb: 0.9}}
  - {type: msc_write_verify, name: 写读校验(LBA0-7, DESTRUCTIVE), lba: 0, blocks: 8, block_size: 512}
