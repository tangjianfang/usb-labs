name: usbtest-mock

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mock-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装基础依赖
        run: pip install pyyaml
      - name: 七实验室产测计划 mock 回归
        run: |
          cd tools
          fail=0
          for plan in ../labs/*/host/autotest.yaml; do
            python -m usbtest --plan "$plan" --mock --report-dir /tmp/reports || fail=1
          done
          exit $fail
      - name: MSC 参考实现离线自测
        run: python tools/usbtest/tests/test_msc.py
      - name: 六产测后端离线自测
        run: python tools/usbtest/tests/test_backends.py
      - name: usbsim 协议仿真器自测
        run: python simulator/tests/test_sim.py
      - name: 轻量校验（链接/围栏）
        run: bash tools/validate.sh

  msvc-build:
    # T13：Windows 原生上位机（Win32/C++20 + spdlog）在 CI 上真实编译，
    # 防止"只在本地能编"的回归；产物随 artifact 上传 7 天供人工冒烟。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置（VS 2022 生成器 x64）
        run: cmake -S apps/win/USBTestStudio -B apps/win/build -G "Visual Studio 17 2022" -A x64
      - name: 编译五靶（主程序+四离线自测）
        run: cmake --build apps/win/build --config Release
      - name: 通道层离线自测（226 例）
        run: ./apps/win/build/Release/channel_selftest.exe
      - name: 设备发现离线自测
        run: ./apps/win/build/Release/discovery_selftest.exe
      - name: 会话台离线自测
        run: ./apps/win/build/Release/session_selftest.exe
      - name: 解析面板离线自测（含 S6 PD 遥测）
        run: ./apps/win/build/Release/parser_selftest.exe
      - name: shell 第六靶离线自测（MS0 IDE 壳）
        run: ./apps/win/build/Release/shell_selftest.exe
      - name: desc 第七靶离线自测（MS1 描述符编译器）
        run: ./apps/win/build/Release/desc_selftest.exe
      - name: vd 第八靶离线自测（MS2 虚拟调试器）
        run: ./apps/win/build/Release/vd_selftest.exe
      - name: te 第九靶离线自测（MS3 测试台）
        run: ./apps/win/build/Release/te_selftest.exe
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: USBDevStudio-win-x64
          path: apps/win/build/Release/USBDevStudio.exe
          retention-days: 7
